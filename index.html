    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Special+Elite&display=swap');

        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            background-color: #1e1b18;

            display: flex; justify-content: center; align-items: center;
            overflow: hidden; user-select: none;
        }

        #game-container {
            width: 100%; max-width: 900px; height: 100vh; max-height: 900px;

            background: #111; box-shadow: 0 0 50px rgba(0,0,0,0.9);
        }

        /* --- BARRA SUPERIOR DE ESTADÍSTICAS --- */
        #top-bar {
            background: #151515; border-bottom: 2px solid #8b0000;

        }
        .stat-box { text-align: center; width: 22%; }
        .stat-label { font-family: 'Special Elite', cursive; color: #ccc; font-size: 0.85em; margin-bottom: 5px;}
        .stat-bar { height: 12px; background: #222; border: 1px solid #444; border-radius: 2px; overflow: hidden; }
        .stat-fill { height: 100%; width: 50%; transition: width 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275), background-color 0.5s; }
        
        #fill-moral { background: #2ecc71; }
        #fill-inf { background: #e74c3c; }
        #fill-debt { background: #f39c12; }
        #fill-mil { background: #3498db; }

            flex: 1; padding: 20px; display: flex; justify-content: center; align-items: flex-start;
            overflow-y: auto; perspective: 1000px;
        }

        .paper {
            background-color: #eaddc5;
            background-image: url('data:image/svg+xml;utf8,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noise)" opacity="0.06"/></svg>');

        }

            from { transform: translateY(-30px) rotateX(5deg); opacity: 0; }
            to { transform: translateY(0) rotateX(0deg); opacity: 1; }
        }

        .classification {
            position: absolute; top: 15px; right: 15px;

        }
        
        .alt-history-tag {
            background: #8b0000; color: #fff; font-family: 'Special Elite', cursive;
            padding: 5px 10px; display: inline-block; margin-bottom: 10px; font-size: 0.9em;
            box-shadow: 2px 2px 0px #222;
        }

            width: 100%; height: 100%; object-fit: cover; object-position: center 20%;

        .stamp-effect {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(2) rotate(-10deg);

const actx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
    if(actx.state === 'suspended') actx.resume();
    const osc = actx.createOscillator(); const gain = actx.createGain();
    
    if(type === 'stamp') {
        osc.type = 'square'; osc.frequency.setValueAtTime(120, actx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(20, actx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.6, actx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + 0.15);
        osc.connect(gain); gain.connect(actx.destination);
        osc.start(); osc.stop(actx.currentTime + 0.15);
    } else if(type === 'paper') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, actx.currentTime);
        gain.gain.setValueAtTime(0.1, actx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + 0.08);
        osc.connect(gain); gain.connect(actx.destination);
        osc.start(); osc.stop(actx.currentTime + 0.08);
    }
}

function enterFullScreen() {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        let docElm = document.documentElement;
        if (docElm.requestFullscreen) docElm.requestFullscreen().catch(()=>{});
        else if (docElm.webkitRequestFullscreen) docElm.webkitRequestFullscreen();
    }
}

function updateUI() {
    for(let k in stats) { stats[k] = Math.max(0, Math.min(100, stats[k])); }
    
    document.getElementById('fill-moral').style.width = stats.moral + "%";
    document.getElementById('fill-inf').style.width = stats.inf + "%";
    document.getElementById('fill-debt').style.width = stats.debt + "%";
    document.getElementById('fill-mil').style.width = stats.mil + "%";
    
    document.getElementById('fill-inf').style.backgroundColor = stats.inf > 70 ? "#8b0000" : "#e74c3c";
    document.getElementById('fill-debt').style.backgroundColor = stats.debt > 70 ? "#8b0000" : "#f39c12";
    document.getElementById('fill-moral').style.backgroundColor = stats.moral < 30 ? "#c0392b" : "#2ecc71";
}

function buildReport() {
    let rep = "<p>La guerra ha concluido. El análisis macroeconómico de su gestión es el siguiente:</p><hr>";
    
    if(stats.mil >= 70) rep += "<p><b>ESTATUS BÉLICO: Súperpotencia.</b> El esfuerzo económico logró proveer una victoria militar aplastante.</p>";
    else if (stats.mil >= 40) rep += "<p><b>ESTATUS BÉLICO: Victoria Dependiente.</b> Sobrevivimos, pero el peso real de la guerra fue financiado por el exterior.</p>";
    else rep += "<p><b>ESTATUS BÉLICO: Colapso.</b> Las malas decisiones económicas dejaron al ejército inoperante. La isla quedó devastada.</p>";

    if(stats.inf >= 70) rep += "<p><b>INFLACIÓN: Hiperinflación.</b> La emisión descontrolada licuó los ahorros de toda la clase media y trabajadora.</p>";
    else rep += "<p><b>INFLACIÓN: Controlada.</b> Logró una hazaña histórica al financiar una guerra sin destruir el valor de la moneda local.</p>";

    if(stats.debt >= 70) rep += "<p><b>DEUDA SOBERANA: Vasallaje Financiero.</b> El país queda atado por 50 años a la deuda estadounidense. Gran Bretaña ha perdido su imperio económico.</p>";
    else rep += "<p><b>DEUDA SOBERANA: Sostenible.</b> Protegió las reservas de oro y la balanza de pagos. El país puede reconstruirse sin depender de potencias extranjeras.</p>";

    if(stats.moral >= 70) rep += "<p><b>SOCIEDAD: El Nuevo Contrato.</b> El Estado de Bienestar está asegurado. La población está lista para trabajar en paz.</p>";
    else rep += "<p><b>SOCIEDAD: Fractura Total.</b> La austeridad y el hambre han generado un caldo de cultivo para rebeliones sindicales inminentes.</p>";

    return rep;
}

function renderPhase(id) {
    if(id === "intro") { stats = { moral: 80, inf: 10, debt: 20, mil: 20 }; updateUI(); }
    
    let p = storyTree[id];
    playSound('paper');

    document.getElementById('ui-date').innerText = p.date;
    document.getElementById('ui-title').innerText = p.title;
    
    // Mostramos la foto, pero si falla el proxy, la ocultamos sin error
    let imgEl = document.getElementById('ui-photo');
    let boxEl = document.getElementById('ui-photo-box');
    boxEl.style.display = 'block'; 
    imgEl.style.display = 'block';
    imgEl.src = p.photo;
    
    document.getElementById('alt-tag').style.display = p.altHistory ? "inline-block" : "none";

    if(id === "final") document.getElementById('ui-text').innerHTML = buildReport();
    else document.getElementById('ui-text').innerHTML = p.text;

    let box = document.getElementById('choices-box');
    box.innerHTML = "";
    
    p.choices.forEach((c, idx) => {
        let btn = document.createElement('button');
        btn.className = 'decision-btn';
        let html = `<span class="btn-title">SELLO: ${c.title}</span>`;
        if(c.hint) html += `<span class="btn-hint">${c.hint}</span>`;
        
        html += `<div class="stamp-effect" id="stamp-${idx}">APROBADO</div>`;
        btn.innerHTML = html;

        btn.onclick = () => {
            enterFullScreen();
            playSound('stamp');
            document.getElementById(`stamp-${idx}`).classList.add('stamp-animate');
            
            if(c.impact) {
                stats.moral += c.impact.moral; stats.inf += c.impact.inf;
                stats.debt += c.impact.debt; stats.mil += c.impact.mil;
                updateUI();
            }

            setTimeout(() => {
                document.getElementById('news-headline').innerText = c.news;
                document.getElementById('news-subhead').innerText = c.sub;
                document.getElementById('newspaper-modal').style.display = 'flex';
                nextPhaseId = c.next;
            }, 500);
        };
        box.appendChild(btn);
    });
}

function nextPhase() {
    document.getElementById('newspaper-modal').style.display = 'none';
    document.getElementById('dossier-wrapper').scrollTop = 0;
    
    let paper = document.getElementById('paper-doc');
    paper.style.animation = 'none';
    void paper.offsetWidth; 
    paper.style.animation = 'slideIn 0.4s ease-out';
    
    renderPhase(nextPhaseId);
}

window.onload = () => {
    updateUI();
    renderPhase('intro');
};
</script>
</body>
</html>
