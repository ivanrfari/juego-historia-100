<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gabinete Macroeconómico - Edición Documental</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Special+Elite&display=swap');

        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            background-color: #2c251f;
            background-image: repeating-linear-gradient(45deg, rgba(0,0,0,0.1) 0px, rgba(0,0,0,0.1) 2px, transparent 2px, transparent 4px);
            font-family: 'Playfair Display', serif;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
            user-select: none;
        }

        #game-container {
            width: 100%; max-width: 900px; height: 100vh; max-height: 900px;
            display: flex; flex-direction: column; position: relative;
            background: #111; box-shadow: 0 0 50px rgba(0,0,0,0.9);
        }

        /* BARRA SUPERIOR DE ESTADÍSTICAS */
        #top-bar {
            background: #1a1a1a; border-bottom: 2px solid #d4af37;
            display: flex; justify-content: space-around; padding: 10px;
            z-index: 10;
        }
        .stat-box { text-align: center; width: 22%; }
        .stat-label { font-family: 'Special Elite', cursive; color: #a9a9a9; font-size: 0.8em; margin-bottom: 5px;}
        .stat-bar { height: 15px; background: #333; border: 1px solid #555; border-radius: 2px; overflow: hidden; position: relative;}
        .stat-fill { height: 100%; width: 50%; transition: width 0.5s, background-color 0.5s; }
        
        #fill-moral { background: #2ecc71; }
        #fill-inf { background: #e74c3c; }
        #fill-debt { background: #e67e22; }
        #fill-mil { background: #3498db; }

        /* ÁREA DEL DOSSIER */
        #dossier-wrapper {
            flex: 1; padding: 20px; display: flex; justify-content: center; align-items: flex-start;
            overflow-y: auto; perspective: 1000px;
        }

        .paper {
            background-color: #f4e9d8;
            background-image: url('data:image/svg+xml;utf8,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noise)" opacity="0.05"/></svg>');
            width: 90%; max-width: 700px; padding: 30px; box-shadow: 5px 5px 15px rgba(0,0,0,0.5);
            color: #222; position: relative;
            transform-origin: top center;
            animation: slideIn 0.5s ease-out;
            margin-bottom: 20px;
        }

        @keyframes slideIn {
            from { transform: translateY(-50px) rotateX(10deg); opacity: 0; }
            to { transform: translateY(0) rotateX(0deg); opacity: 1; }
        }

        .classification {
            position: absolute; top: 20px; right: 20px;
            font-family: 'Special Elite', cursive; color: #c0392b; border: 3px solid #c0392b;
            padding: 5px 10px; transform: rotate(-5deg); font-size: 1.2em; opacity: 0.8;
            z-index: 5;
        }

        .date { font-family: 'Special Elite', cursive; font-size: 1.1em; color: #555; border-bottom: 1px dashed #777; padding-bottom: 5px; margin-bottom: 15px;}
        h1 { font-size: 2em; margin-top: 0; margin-bottom: 15px; color: #111; line-height: 1.2;}
        .body-text { font-size: 1.2em; line-height: 1.6; text-align: justify; margin-bottom: 20px;}
        
        .economic-note {
            background: rgba(0,0,0,0.05); border-left: 4px solid #2980b9;
            padding: 10px 15px; font-style: italic; font-size: 1.1em; margin-bottom: 20px;
        }

        /* FOTOGRAFÍAS HISTÓRICAS */
        .historical-photo-container {
            width: 100%; max-height: 250px; overflow: hidden;
            margin-bottom: 20px; border: 6px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            background: #000; display: flex; justify-content: center; align-items: center;
        }
        .historical-photo {
            width: 100%; height: 100%; object-fit: cover; object-position: top;
            filter: grayscale(100%) sepia(40%) contrast(1.3) brightness(0.9); 
        }

        /* BOTONES DE DECISIÓN ESTILO SELLO */
        .choices-container { display: flex; flex-direction: column; gap: 15px; border-top: 2px solid #ccc; padding-top: 20px;}
        
        .decision-btn {
            background: #fff; border: 2px solid #555; padding: 15px;
            text-align: left; font-family: 'Playfair Display', serif; font-size: 1.2em;
            cursor: pointer; position: relative; overflow: hidden;
            transition: all 0.2s; box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
            -webkit-tap-highlight-color: transparent;
        }
        .decision-btn:hover { background: #f0f0f0; transform: translateX(5px); border-color: #111;}
        .btn-title { font-weight: bold; display: block; margin-bottom: 5px;}
        .btn-hint { font-size: 0.85em; font-family: 'Special Elite', cursive; color: #c0392b;}

        /* EFECTO DE SELLO AL HACER CLIC */
        .stamp-effect {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(2) rotate(-15deg);
            font-family: 'Special Elite', cursive; font-size: 3em; color: #c0392b; border: 4px solid #c0392b;
            padding: 10px; opacity: 0; pointer-events: none;
        }
        .stamp-animate { animation: stampDown 0.4s forwards; }
        @keyframes stampDown {
            0% { transform: translate(-50%, -50%) scale(2) rotate(-15deg); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1) rotate(-15deg); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1) rotate(-15deg); opacity: 0; }
        }

        /* MODAL DE PERIÓDICO (FEEDBACK) */
        #newspaper-modal {
            position: fixed; top:0; left:0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 100;
        }
        .newspaper {
            background: #e8dcc4; width: 90%; max-width: 600px; padding: 20px;
            text-align: center; border: 10px solid double #333; box-shadow: 0 0 20px #000;
            font-family: 'Playfair Display', serif; color: #222;
            animation: spinZoom 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes spinZoom {
            0% { transform: scale(0.1) rotate(-720deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .news-header { font-size: 2.5em; border-bottom: 2px solid #222; margin-bottom: 10px; font-weight: bold; text-transform: uppercase;}
        .news-sub { font-size: 1.2em; font-style: italic; margin-bottom: 20px; }
        .news-btn { background: #222; color: #fff; border: none; padding: 10px 20px; font-family: 'Special Elite', cursive; font-size: 1.2em; cursor: pointer; margin-top: 20px;}

        /* SCROLLBAR */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }

        @media (max-width: 600px) {
            .paper { width: 95%; padding: 20px; }
            h1 { font-size: 1.5em; }
            .body-text { font-size: 1.1em; }
            .decision-btn { font-size: 1.1em; padding: 10px;}
            .stat-label { font-size: 0.65em; }
            .news-header { font-size: 1.8em; }
            .historical-photo-container { max-height: 180px; }
        }
    </style>
</head>

<script>
// --- AUDIO ---
const actx = new (window.AudioContext || window.webkitAudioContext)();
function playStamp() {
    if(actx.state === 'suspended') actx.resume();
    const osc = actx.createOscillator(); const gain = actx.createGain();
    osc.type = 'square'; osc.frequency.setValueAtTime(100, actx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(10, actx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.5, actx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + 0.1);
    osc.connect(gain); gain.connect(actx.destination);
    osc.start(); osc.stop(actx.currentTime + 0.1);
}
function playPaper() {
    if(actx.state === 'suspended') actx.resume();
    const osc = actx.createOscillator(); const gain = actx.createGain();
    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(400, actx.currentTime);
    gain.gain.setValueAtTime(0.1, actx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + 0.05);
    osc.connect(gain); gain.connect(actx.destination);
    osc.start(); osc.stop(actx.currentTime + 0.05);
}

function enterFullScreen() {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        let docElm = document.documentElement;
        if (docElm.requestFullscreen) docElm.requestFullscreen().catch(()=>{});
        else if (docElm.webkitRequestFullscreen) docElm.webkitRequestFullscreen();
    }
}

function updateUI() {
    for(let k in stats) { stats[k] = Math.max(0, Math.min(100, stats[k])); }
    document.getElementById('fill-moral').style.width = stats.moral + "%";
    document.getElementById('fill-inf').style.width = stats.inf + "%";
    document.getElementById('fill-debt').style.width = stats.debt + "%";
    document.getElementById('fill-mil').style.width = stats.mil + "%";
    
    // Warning colors
    document.getElementById('fill-inf').style.backgroundColor = stats.inf > 70 ? "#8b0000" : "#e74c3c";
    document.getElementById('fill-debt').style.backgroundColor = stats.debt > 70 ? "#8b0000" : "#e67e22";
    document.getElementById('fill-moral').style.backgroundColor = stats.moral < 30 ? "#c0392b" : "#2ecc71";
}

function buildReport() {
    let rep = "<p>La guerra ha concluido. El análisis de su gestión arroja los siguientes resultados:</p><hr>";
    
    if(stats.mil >= 60) rep += "<p><b>Victoria Militar:</b> Logró abastecer al frente. Alemania fue derrotada gracias al enorme esfuerzo logístico de la nación.</p>";
    else rep += "<p><b>Estancamiento Militar:</b> Su falta de financiamiento dejó al ejército paralizado. La guerra se ganó sólo gracias a la intervención extranjera directa.</p>";

    if(stats.inf >= 70) rep += "<p><b>Hiperinflación:</b> Emitió sin control. Los ahorros de la clase media se evaporaron, destruyendo el poder adquisitivo.</p>";
    else rep += "<p><b>Estabilidad de Precios:</b> Logró contener el flagelo inflacionario, una hazaña rara en una economía de guerra.</p>";

    if(stats.debt >= 70) rep += "<p><b>Colonia Financiera:</b> El país está en bancarrota. La enorme deuda externa con EE.UU. dictará nuestra política durante las próximas 5 décadas.</p>";
    else rep += "<p><b>Soberanía Económica:</b> Mantuvo las finanzas bajo control relativo, salvando parte de nuestra independencia financiera.</p>";

    if(stats.moral >= 60) rep += "<p><b>Paz Social:</b> Sentó las bases para el Estado de Bienestar. La población está lista para reconstruir el país unida.</p>";
    else rep += "<p><b>Fractura Social:</b> Las huelgas y el malestar dominan las calles. Las exigencias al pueblo fueron excesivas sin promesas a cambio.</p>";

    return rep;
}

function renderPhase(id) {
    if(id === "intro") { stats = { moral: 80, inf: 10, debt: 20, mil: 20 }; updateUI(); }
    
    let p = phases.find(x => x.id === id);
    playPaper();

    document.getElementById('ui-date').innerText = p.date;
    document.getElementById('ui-title').innerText = p.title;
    
    // Foto
    let photoBox = document.getElementById('ui-photo-box');
    if(p.photo) {
        document.getElementById('ui-photo').src = p.photo;
        photoBox.style.display = "flex";
    } else {
        photoBox.style.display = "none";
    }
    
    if(id === "final") {
        document.getElementById('ui-text').innerHTML = buildReport();
    } else {
        document.getElementById('ui-text').innerHTML = p.text;
    }

    let box = document.getElementById('choices-box');
    box.innerHTML = "";
    
    p.choices.forEach((c, idx) => {
        let btn = document.createElement('button');
        btn.className = 'decision-btn';
        let html = `<span class="btn-title">SELLO: ${c.title}</span>`;
        if(c.hint) html += `<span class="btn-hint">${c.hint}</span>`;
        
        // El sello animado
        html += `<div class="stamp-effect" id="stamp-${idx}">APROBADO</div>`;
        btn.innerHTML = html;

        btn.onclick = () => {
            enterFullScreen();
            playStamp();
            document.getElementById(`stamp-${idx}`).classList.add('stamp-animate');
            
            if(c.impact) {
                stats.moral += c.impact.moral; stats.inf += c.impact.inf;
                stats.debt += c.impact.debt; stats.mil += c.impact.mil;
                updateUI();
            }

            setTimeout(() => {
                document.getElementById('news-headline').innerText = c.news;
                document.getElementById('news-subhead').innerText = c.sub;
                document.getElementById('newspaper-modal').style.display = 'flex';
                nextPhaseId = c.next;
            }, 600);
        };
        box.appendChild(btn);
    });
}

function nextPhase() {
    document.getElementById('newspaper-modal').style.display = 'none';
    document.getElementById('dossier-wrapper').scrollTop = 0;
    
    // Animar la entrada del papel
    let paper = document.getElementById('paper-doc');
    paper.style.animation = 'none';
    void paper.offsetWidth; 
    paper.style.animation = 'slideIn 0.5s ease-out';
    
    renderPhase(nextPhaseId);
}

window.onload = () => {
    updateUI();
    renderPhase('intro');
};

</script>
</body>
</html>
